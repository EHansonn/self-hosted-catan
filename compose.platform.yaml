name: crossroads-platform

services:
  game:
    build:
      context: .
    restart: unless-stopped
    init: true
    expose:
      - "8080"
    volumes:
      - game-data:/app/data
    environment:
      APP_NAME: ${APP_NAME:-Crossroads}
      ROOM_CREATE_PASSWORD: ${ROOM_CREATE_PASSWORD:?set ROOM_CREATE_PASSWORD in .env}
      SECURE_COOKIE: "true"
      ALLOWED_ORIGINS: https://${PUBLIC_HOSTNAME:?set PUBLIC_HOSTNAME in .env}
      TRUST_PROXY_HEADERS: "true"
      PLAYER_DISCONNECT_GRACE_MS: ${PLAYER_DISCONNECT_GRACE_MS:-120000}
    mem_limit: ${GAME_MEMORY_LIMIT:-256m}
    cpus: ${GAME_CPU_LIMIT:-0.50}
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:size=8m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: "2m"
        max-file: "2"
    networks:
      backend:
      edge:
        aliases:
          - catan-game

volumes:
  game-data:

networks:
  backend:
    internal: true
  edge:
    external: true
    name: edge
